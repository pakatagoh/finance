name: Finance CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://finance:finance@localhost:5432/finance?sslmode=disable
      FINANCE_API_TOKEN: finance-ci-token
      APP_ORIGIN: http://localhost:8080
      DISPLAY_TIMEZONE: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install generation tools
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1118
          curl --fail --silent --show-error --location \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.5/tailwindcss-linux-x64 \
            --output "$RUNNER_TEMP/tailwindcss"
          echo "e47695cee3f0d90623a91f3939b08bdee610eb5ad99340adff9d4145b284d6cc  $RUNNER_TEMP/tailwindcss" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/tailwindcss"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check Mise environment separation and image contracts
        run: |
          python3 -m unittest discover -s build -p 'test_mise_config.py'
          python3 -m unittest discover -s build -p 'test_dockerfile.py'
          python3 -m unittest discover -s build -p 'test_worker_jobs.py'
          sh -n jobs/backup.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Generate templ files
        run: |
          templ generate
          git diff --exit-code -- '*.templ' '*_templ.go'

      - name: Generate CSS
        run: tailwindcss -i assets/css/input.css -o static/css/app.css --minify

      - name: Check generated CSS component regressions
        run: python3 -m unittest discover -s build -p 'test_assets.py'

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration ./...

      - name: Test clean migrations
        run: go run ./cmd/finance migrate

      - name: Test repeated migrations
        run: |
          go run ./cmd/finance migrate
          go run ./cmd/finance migrate

      - name: Build the three Finance images
        shell: bash
        run: |
          for target in runtime categorizer backup; do
            docker build --pull --platform linux/amd64 --provenance=false --target "$target" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "finance:ci-$target" .
          done

      - name: Smoke-test images and restore a synthetic backup
        run: |
          python3 build/smoke_container_images.py --prefix finance:ci
          python3 build/smoke_worker_jobs.py --prefix finance:ci

      # Publish the exact builds that passed smoke tests.
      - name: Archive verified images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker save finance:ci-runtime finance:ci-categorizer finance:ci-backup \
            | gzip -1 > "$RUNNER_TEMP/finance-images.tar.gz"

      - name: Upload verified images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: finance-images
          path: ${{ runner.temp }}/finance-images.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: finance-image-publish
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute image tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skipping publication: this run no longer matches main.'
            exit 0
          fi
          echo "value=$(date +%s%3N)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download verified images
        if: steps.tag.outputs.value != ''
        uses: actions/download-artifact@v4
        with:
          name: finance-images
          path: ${{ runner.temp }}

      - name: Load verified images
        if: steps.tag.outputs.value != ''
        run: docker load --input "$RUNNER_TEMP/finance-images.tar.gz"

      - name: Log in to GHCR
        if: steps.tag.outputs.value != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the three verified images
        if: steps.tag.outputs.value != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          registry=ghcr.io/pakatagoh
          docker tag finance:ci-categorizer "$registry/finance-categorizer:$RELEASE_TAG"
          docker tag finance:ci-backup "$registry/finance-backup:$RELEASE_TAG"
          docker tag finance:ci-runtime "$registry/finance:$RELEASE_TAG"
          docker push "$registry/finance-categorizer:$RELEASE_TAG"
          docker push "$registry/finance-backup:$RELEASE_TAG"
          # Keep the Flux-tracked web package and tag format unchanged.
          docker push "$registry/finance:$RELEASE_TAG"

      - name: Retain newest 10 image versions
        if: steps.tag.outputs.value != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: finance
          package-type: container
          min-versions-to-keep: 10
