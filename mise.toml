# Shared tools for development, CI and container builds.
# Keep local database settings and development-only tools in the development overlay.
[tools]
go = "1.27.4"
"go:github.com/a-h/templ/cmd/templ" = "v0.3.1118"
"github:tailwindlabs/tailwindcss" = "v4.3.5"

[tasks.generate]
description = "Generate templ Go files"
run = "templ generate"

[tasks.css]
description = "Build minified Tailwind and daisyUI CSS"
run = "tailwindcss -i assets/css/input.css -o static/css/app.css --minify"

[tasks.test-unit]
description = "Run unit tests"
run = "go test ./..."
